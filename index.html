<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b09">
  <meta name="description" content="La tua bambina interiore — Sara Valentino">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sara">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Sara Valentino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

    <!-- TOP BAR -->
    <nav class="topbar">
      <div class="topbar-brand">Sara <span>Valentino</span></div>
      <div class="topbar-actions" id="topbar-user" style="display:none">
        <button class="btn-icon" onclick="handleLogout()">Esci</button>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="main-content">

      <!-- LOADING -->
      <div id="screen-loading" class="screen active">
        <div class="loading-screen">
          <div class="loading-dot"></div>
        </div>
      </div>

      <!-- AUTH -->
      <div id="screen-auth" class="screen"></div>

      <!-- LIBRARY -->
      <div id="screen-library" class="screen"></div>

      <!-- PRODUCT -->
      <div id="screen-product" class="screen"></div>

      <!-- SECTION -->
      <div id="screen-section" class="screen"></div>

    </main>
  </div>

  <!-- UNLOCK MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
